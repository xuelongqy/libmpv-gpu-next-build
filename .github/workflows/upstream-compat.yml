name: upstream compatibility

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pipx pkg-config \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev libass-dev \
            libdav1d-dev libegl-dev libgl-dev liblcms2-dev libunwind-dev \
            libxxhash-dev
          pipx install meson==1.12.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check maintained branches against upstream master
        id: compatibility
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/check-upstream.sh --build 2>&1 | tee upstream-compat.log
      - name: Write compatibility summary
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.compatibility.outcome }}
        run: |
          {
            echo '## Upstream compatibility'
            echo
            echo "Result: \`$CHECK_OUTCOME\`"
            echo
            echo '```text'
            if [[ -f upstream-compat.log ]]; then
              if [[ "$CHECK_OUTCOME" == success ]]; then
                awk '/^compat:/' upstream-compat.log
              else
                tail -n 80 upstream-compat.log
              fi
            else
              echo 'compatibility command did not produce a log'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail incompatible source combinations
        if: steps.compatibility.outcome != 'success'
        run: exit 1
