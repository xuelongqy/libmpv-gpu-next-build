name: experimental software Vulkan

on:
  workflow_dispatch:
  push:
    branches: [feat/vulkan-experimental-delivery]
  pull_request:
    branches: [feat/vulkan-experimental-delivery]

permissions:
  contents: read

jobs:
  linux-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Install build and software-device dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pipx python3-venv pkg-config shellcheck \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev libdav1d-dev liblcms2-dev \
            libegl-dev libgl-dev libshaderc-dev libsdl2-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools ffmpeg xvfb xauth
          # Noble's 1.3.275 layer lacks the ALL_COMMANDS/layout-transition fix:
          # https://github.com/KhronosGroup/Vulkan-ValidationLayers/pull/7480
          mkdir -p .work
          curl --fail --location --retry 3 --max-time 60 \
            https://packages.lunarg.com/vulkan/1.4.313/pool/main/v/vulkan-validationlayers/vulkan-validationlayers_1.4.313.0~rc2-1lunarg24.04-1_amd64.deb \
            -o .work/validation.deb
          echo 'b100bfafac3df98c5d8ef5a572b423bcd9ebf3fab963e2e68957f4bf6f2423f0  .work/validation.deb' | sha256sum --check
          sudo apt-get install -y ./.work/validation.deb
          dpkg-query -W vulkan-validationlayers
          pipx install meson==1.12.0
          python3 -m venv .work/python
          .work/python/bin/pip install numpy pillow
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$PWD/.work/python/bin" >> "$GITHUB_PATH"
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Check tools and build the locked candidate
        run: |
          bash -n experiments/vulkan/*.sh
          shellcheck -x -P SCRIPTDIR experiments/vulkan/*.sh
          python3 experiments/vulkan/test-tools.py
          bash experiments/vulkan/build.sh
      - name: Run library tests
        run: bash experiments/vulkan/tests.sh
      - name: Run Lavapipe readback and lifecycle checks
        run: |
          vulkaninfo --summary
          xvfb-run -a bash experiments/vulkan/check-linux.sh
